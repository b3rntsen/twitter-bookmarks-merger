# Nginx configuration for Twitter Bookmarks
# Now an internal HTTP-only upstream behind /srv/edge nginx, which
# terminates TLS for twitter.dethele.com and proxies in over edge_net.
#
# Serves:
# - / : Static HTML from twitter_bookmarks (with auth)
# - /new-gen/* : Django app (old web-test functionality)
# - /accounts/* : OAuth callbacks

# Rate limiting
limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;

# Upstream Django application
upstream django {
    server web:8000;
}

# Single internal HTTP server. TLS terminated upstream at /srv/edge.
server {
    listen 80;
    server_name twitter.dethele.com _;

    # Client body size (for file uploads)
    client_max_body_size 100M;

    # Rate limiting
    limit_req zone=general burst=20 nodelay;

    # ============================================
    # Auth check endpoint (internal, for auth_request)
    # ============================================
    location = /auth-check {
        internal;
        proxy_pass http://django/accounts/auth-check/;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # Redirect to login when not authenticated.
    # Use $http_x_forwarded_proto so the absolute Location becomes https://
    # (this server is reached only via the TLS-terminating edge, which sets
    # X-Forwarded-Proto: https).
    location @login_redirect {
        return 302 $http_x_forwarded_proto://$host/accounts/google/login/?next=$request_uri;
    }

    # ============================================
    # OAuth routes (must be at root for Google callback)
    # ============================================
    location /accounts/ {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $http_x_forwarded_port;
        proxy_redirect off;
    }

    # ============================================
    # Django admin at /admin/
    # ============================================
    location /admin/ {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $http_x_forwarded_port;
        proxy_redirect off;
    }

    # ============================================
    # Django new-gen app at /new-gen/
    # ============================================
    location /new-gen/ {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $http_x_forwarded_port;
        proxy_redirect off;

        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Extended timeout for sync operations
    location /new-gen/twitter/sync/ {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $http_x_forwarded_port;
        proxy_redirect off;

        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }

    # ============================================
    # Django static files (for /new-gen/ app)
    # ============================================
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Django media files (for /new-gen/ app)
    location /media/tweets/ {
        auth_request /auth-check;
        error_page 401 = @login_redirect;
        alias /app/media/tweets/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # ============================================
    # Bookmarks media (from twitter_bookmarks) - immutable, long cache
    # ============================================
    location /media/bookmarks/ {
        auth_request /auth-check;
        error_page 401 = @login_redirect;
        alias /app/bookmarks-media/;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        etag on;
    }

    # ============================================
    # Article media (covers + body images cached locally) - same caching profile
    # ============================================
    location /media/articles/ {
        auth_request /auth-check;
        error_page 401 = @login_redirect;
        alias /app/bookmarks-articles/;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        etag on;
    }

    # ============================================
    # JSON data files - cache with revalidation (updated frequently)
    # ============================================
    location /data/ {
        auth_request /auth-check;
        error_page 401 = @login_redirect;

        alias /app/bookmarks-html/data/;
        add_header Cache-Control "no-cache" always;
        etag on;
    }

    # ============================================
    # Static HTML site at root (from twitter_bookmarks)
    # Requires authentication via Django
    # Cache with revalidation for fresh content
    # ============================================
    location / {
        auth_request /auth-check;
        error_page 401 = @login_redirect;

        root /app/bookmarks-html;
        index index.html;
        try_files $uri $uri/ /index.html;

        add_header Cache-Control "no-cache" always;
        etag on;
    }
}
