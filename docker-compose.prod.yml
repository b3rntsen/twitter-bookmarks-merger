services:
  redis:
    image: redis:7-alpine
    # Don't expose port externally - only accessible within Docker network
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 300M
        reservations:
          memory: 200M
    networks:
      - app-network

  web:
    image: twitter-bookmarks-web
    build: .  # Fallback if image doesn't exist
    init: true
    command: python manage.py runserver 0.0.0.0:8000
    # Production: no volume mounts for code (baked into image)
    # But mount staticfiles and media for nginx to serve
    # Also mount database directory to persist data
    volumes:
      - staticfiles:/app/staticfiles
      - media:/app/media
      - db_data:/app/db
    # Don't expose port 8000 directly - nginx will proxy
    expose:
      - "8000"
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - STATIC_ROOT=/app/staticfiles
      - Q_WORKERS=1  # Reduce workers to 1 for memory conservation
    depends_on:
      redis:
        condition: service_healthy
    restart: always
    deploy:
      resources:
        limits:
          memory: 600M
        reservations:
          memory: 400M
    # Health check - check if Django is responding
    healthcheck:
      test: ["CMD", "python", "-c", "import http.client; c = http.client.HTTPConnection('localhost', 8000, timeout=5); c.request('GET', '/accounts/health/', headers={'X-Forwarded-Proto': 'https'}); r = c.getresponse(); exit(0 if r.status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - app-network

  qcluster:
    image: twitter-bookmarks-web
    build: .  # Fallback if image doesn't exist
    init: true
    command: python manage.py qcluster
    volumes:
      - media:/app/media
      - db_data:/app/db
      - ./birdmarks:/app/birdmarks:ro
      - ./birdmarks_cache:/app/birdmarks_cache
      - ./bookmarks-media:/app/bookmarks-media
      - ./bookmarks-articles:/app/bookmarks-articles
      - ./master:/app/master
      - ./server:/app/server
      - ./bookmarks-html:/app/bookmarks-html
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - Q_WORKERS=1  # Process only one job at a time to limit memory usage
      - Q_QUEUE_LIMIT=10  # Reduce queue limit
      - BOOKMARKS_MEDIA_DIR=/app/bookmarks-media
      - BOOKMARKS_ARTICLE_MEDIA_DIR=/app/bookmarks-articles
    depends_on:
      redis:
        condition: service_healthy
      web:
        condition: service_started
    restart: always
    deploy:
      resources:
        limits:
          memory: 1.5G  # Playwright/Chromium headroom; raised from 800M after the t3.medium (4GB) upgrade
        reservations:
          memory: 500M
    networks:
      - app-network

  nginx:
    image: twitter-bookmarks-nginx
    build:
      context: ./nginx
      dockerfile: Dockerfile
    # Ports no longer bound to host — /srv/edge nginx terminates TLS and
    # proxies into here over the shared `edge_net` bridge.
    expose:
      - "80"
    volumes:
      # SSL certificates no longer needed — edge owns TLS. Mount left
      # in place (read-only) only because some old conf paths reference
      # them; the new nginx.conf no longer touches /etc/letsencrypt.
      - certbot-etc:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot
      # Static and media files (for Django /new-gen/ app)
      - staticfiles:/app/staticfiles:ro
      - media:/app/media:ro
      # Static bookmarks site (synced via rsync from local)
      - ./bookmarks-html:/app/bookmarks-html:ro
      - ./bookmarks-media:/app/bookmarks-media:ro
      - ./bookmarks-articles:/app/bookmarks-articles:ro
    depends_on:
      - web
    restart: always
    networks:
      - app-network
      - edge_net

volumes:
  media:
  staticfiles:
  db_data:  # Persist database across container recreates
  redis_data:  # Persist Redis data across container recreates
  certbot-etc:  # legacy: certs migrated to /srv/edge/letsencrypt; named volume kept for now
  certbot-www:

networks:
  app-network:
    driver: bridge
  edge_net:
    external: true
